version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyphersight_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyphersight_worker
    command: ["node", "dist/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: cyphersight_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

